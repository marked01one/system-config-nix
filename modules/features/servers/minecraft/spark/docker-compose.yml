services:
  bytebin:
    image: ghcr.io/lucko/bytebin
    ports:
      - 23380:8080
    volumes:
      - data:/var/lib/bytebin/content
      - db:/var/lib/bytebin/db
    environment:
      # You can configure bytebin using
      # environment variables.
      BYTEBIN_MISC_KEYLENGTH: 15
      BYTEBIN_CONTENT_MAXSIZE: 5

  bytesocks:
    image: ghcr.io/lucko/bytesocks
    ports:
      - 23381:8080
    environment:
      # You can configure bytesocks using
      # environment variables.
      BYTESOCKS_MISC_KEYLENGTH: 15
      BYTESOCKS_RATELIMIT_MSG_AMOUNT: 10000

volumes:
  data: {}
  db: {}
